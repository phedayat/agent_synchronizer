version: 2

builds:
  - main: ./cmd/agent-synchronizer
    binary: agent-synchronizer
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.Date={{.Date}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: "checksums.txt"
