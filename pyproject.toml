[project]
name = "agent-synchronizer"
version = "0.2.2"
description = "Synchronize agent files across providers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
agent-synchronizer = "agent_synchronizer.__main__:cli"

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/phedayat/agent_synchronizer"
"Bug Tracker" = "https://github.com/phedayat/agent_synchronizer/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
